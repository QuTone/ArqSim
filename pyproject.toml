[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arqsim"
version = "0.2.0"
description = "System-level evaluation framework for fault-tolerant quantum architectures"
authors = [{ name = "Xiang Fang" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "fault-tolerant quantum computing",
    "quantum architecture",
    "quantum compiler",
    "resource estimation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "networkx>=2.6",
    "pyyaml>=5.4",
    "qiskit>=1.0",
]

[project.optional-dependencies]
nwqec = [
    "nwqec>=0.1.2,<0.2",
]
visualization = [
    "matplotlib>=3.7",
]
test = [
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/QuTone/ArqSim"
Documentation = "https://github.com/QuTone/ArqSim/tree/main/docs"
Issues = "https://github.com/QuTone/ArqSim/issues"
Repository = "https://github.com/QuTone/ArqSim.git"

[project.scripts]
arqsim = "arqsim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
# Public packages are explicit so ignored local directories cannot enter a wheel.
include = [
    "arqsim",
    "arqsim.architecture",
    "arqsim.architecture.gallery",
    "arqsim.architecture.gallery._shared",
    "arqsim.architecture.gallery.na_c_plus_sc_f",
    "arqsim.architecture.gallery.na_cf",
    "arqsim.architecture.gallery.na_m_plus_sc_cf",
    "arqsim.architecture.gallery.na_mc_plus_sc_f",
    "arqsim.architecture.gallery.na_mcf",
    "arqsim.architecture.gallery.sc_cf",
    "arqsim.compiler",
    "arqsim.compiler.neutral_atom",
    "arqsim.evaluation",
    "arqsim.operation_profiles",
    "arqsim.program",
    "arqsim.qec",
    "arqsim.synthesizer",
    "arqsim.visualization",
]

[tool.setuptools.package-data]
"arqsim" = [
    "architecture/gallery/na_c_plus_sc_f/profile.yaml",
    "architecture/gallery/na_cf/profile.yaml",
    "architecture/gallery/na_m_plus_sc_cf/profile.yaml",
    "architecture/gallery/na_mc_plus_sc_f/profile.yaml",
    "architecture/gallery/na_mcf/profile.yaml",
    "architecture/gallery/sc_cf/profile.yaml",
    "qec/protocol_profiles/*.yaml",
    "operation_profiles/fidelity_profiles/*.yaml",
]

[tool.setuptools.exclude-package-data]
"arqsim" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that use an installed optional backend",
]
