name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade 'setuptools>=77' wheel
      - name: Install core and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run core tests
        run: python -m pytest -q
      - name: Verify package artifacts
        run: python tests/run_packaging_smoke.py
      - name: Replay the finite-injection System Case
        run: python system_cases/finite_runtime_injection_demo/run.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: frontend/backend
        run: python -m pip install -r requirements.txt pytest
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test report adapter
        working-directory: frontend
        run: npm run test:adapter
      - name: Test backend adapter
        working-directory: frontend
        run: npm run test:backend
      - name: Build frontend
        working-directory: frontend
        run: npm run build
