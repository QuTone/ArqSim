schema_version: arqsim.fidelity-fit.v1
id: lightstim-unrotated-surface-ppm-p1e3

experiment:
  code: unrotated_surface_code
  protocol: multi_patch_z_product_lattice_surgery
  physical_error_probability: 1.0e-3
  initial_basis: Z
  measurement_basis: Z
  decoder: pymatching
  metric: decoded_z_product_parity_failure
  layout: alternating_left_right_vertical_corridor
  syndrome_rounds_before_coupling: d
  syndrome_rounds_with_coupler: d

multi_patch_fit:
  minimum_weight: 2
  effective_weight: 2*ceil(weight/2)
  formula: 1-exp(-10^(a*distance+b*log10(effective_weight)+c))
  coefficients:
    a: -0.535717275935929
    b: 1.1728480909396906
    c: -1.2223865401600522
  transformed_hazard_r_squared: 0.9980585726241805
  delta_aic_raw_minus_paired: 62.96746601618361
  calibrated_distances: [3, 5, 7]
  calibrated_weights: [2, 3, 4, 5, 6, 7, 8, 12, 16]

weight_one_control:
  protocol: single_patch_z_memory_readout_no_coupler_2d_rounds
  formula: 1-exp(-10^(a*distance+c))
  coefficients:
    a: -0.5692100384251828
    c: -1.0455168530404118
  transformed_hazard_r_squared: 0.9985396293194345
  source_points:
    - {distance: 3, operation_ler: 0.0017166666666666667}
    - {distance: 5, operation_ler: 0.00013605442176870748}
    - {distance: 7, operation_ler: 8.2e-6}

