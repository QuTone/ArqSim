schema_version: arqsim.system-case.v1
id: finite_runtime_injection_demo
title: Fully scheduled T-injection runtime vertical slice
purpose: >-
  Make ArqSim's shared entangle, magic measurement, finite reaction/correction,
  and location-aware fidelity contracts reviewable in one small, deterministic,
  independently replayable profile-2.3 System Case without changing black-box
  default semantics.

ownership:
  source: arqsim_owned_toy_circuit
