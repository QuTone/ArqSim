schema_version: arqsim.fidelity-fit.v1
id: lightstim-unrotated-surface-ppm-p1e3

experiment:
  code: unrotated_surface_code
  protocol: multi_patch_z_product_lattice_surgery
  physical_error_probability: 1.0e-3
  initial_basis: Z
  measurement_basis: Z
  decoder: pymatching
  metric: decoded_z_product_parity_failure
