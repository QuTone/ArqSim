  transformed_hazard_r_squared: 0.9980585726241805
  delta_aic_raw_minus_paired: 62.96746601618361
  calibrated_distances: [3, 5, 7]
  calibrated_weights: [2, 3, 4, 5, 6, 7, 8, 12, 16]

weight_one_control:
  protocol: single_patch_z_memory_readout_no_coupler_2d_rounds
  formula: 1-exp(-10^(a*distance+c))
